# .github/workflows/ci.yml — PR / push checks. Untrusted code, so: read-only token, no secrets.
# Actions use major tags (house style).
# npm by default. Existing Yarn/pnpm repos keep their own lockfile: swap cache + install line (see comments).
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Pin the major for reproducibility; audit.mjs checks it against the nodejs/Release schedule.
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm }
      - run: npm ci                    # Yarn 1: yarn install --frozen-lockfile · Yarn 4: corepack enable + yarn install --immutable
      # Electron >= 42 only: runtime is no longer downloaded by postinstall.
      # - run: npx install-electron
      - run: npm run lint && npm run typecheck && npm test
      # ---- Tauri only: skipped automatically in an Electron repo ----
      - if: runner.os == 'Linux' && hashFiles('src-tauri/Cargo.toml') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - if: hashFiles('src-tauri/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
      - if: hashFiles('src-tauri/Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
        with: { workspaces: './src-tauri -> target' }
      - if: hashFiles('src-tauri/Cargo.toml') != ''
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - if: hashFiles('src-tauri/Cargo.toml') != ''
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
