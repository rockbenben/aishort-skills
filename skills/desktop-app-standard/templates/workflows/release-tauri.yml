# .github/workflows/release.yml — Tauri v2, multi-platform, draft → verify → publish.
# desktop-app-standard house style. Must live on the DEFAULT branch;
# a tag push runs the workflow file *as it exists in the tagged commit*.
#
# Flow: validate (tag ⇄ version, tests) → build matrix (tauri-action uploads to ONE draft)
#       → publish (verify assets + latest.json, SHA256SUMS, attest, approve, publish, check latest)
#       → winget (optional, after publish).
# Secrets: TAURI_SIGNING_PRIVATE_KEY(+_PASSWORD) mandatory when the updater is enabled.
#          APPLE_* optional (without them: ad-hoc sign via bundle.macOS.signingIdentity "-").
#          Windows signing: configure bundle.windows.signCommand (Azure Artifact Signing) in tauri.conf.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag: { description: 'Existing tag to rebuild. Dispatch on that tag ref, e.g. v1.2.3', required: true }
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: 'refs/tags/${{ env.TAG }}' }
      - id: version
        name: Tag is the single version source
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
          v="${TAG#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version ?? ''")
          [ "$pkg" = "$v" ] || { echo "::error::version mismatch: package.json $pkg != tag $v"; exit 1; }
          [ "$conf" = "../package.json" ] || [ "$conf" = "$v" ] || { echo "::error::version mismatch: tauri.conf.json $conf"; exit 1; }
          commit=$(git rev-parse HEAD)
          event_commit=$(git rev-parse --verify "$GITHUB_SHA^{commit}") || { echo "::error::Dispatch this workflow on the target tag ref"; exit 1; }
          [[ "$commit" == "$event_commit" ]] || { echo "::error::Tag and workflow event point to different commits"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm }
      - run: npm ci                     # Yarn 1: yarn install --frozen-lockfile · Yarn 4: corepack enable + yarn install --immutable
      - run: npm run lint && npm run typecheck && npm test
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: './src-tauri -> target' }
      - name: Verify installed Tauri release majors
        run: |
          npm ls --depth=0 --json > "$RUNNER_TEMP/npm-tree.json"
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 > "$RUNNER_TEMP/cargo-tree.json"
          node <<'NODE'
          const { dependencies } = require(process.env.RUNNER_TEMP + '/npm-tree.json');
          const metadata = require(process.env.RUNNER_TEMP + '/cargo-tree.json');
          const targets = require('./.github/desktop-version-targets.json');
          function verify(name, version, major) {
            if (!/^\d+\.\d+\.\d+$/.test(version) || Number(version.split('.')[0]) !== major) {
              throw new Error(name + ': expected stable ' + major + '.x, installed ' + version);
            }
            console.log(name, version);
          }
          verify('@tauri-apps/cli', dependencies?.['@tauri-apps/cli']?.version, targets.npm['@tauri-apps/cli']);
          const api = dependencies?.['@tauri-apps/api'];
          if (api) verify('@tauri-apps/api', api.version, targets.npm['@tauri-apps/api']);
          const members = new Set(metadata.workspace_members);
          const direct = new Set(metadata.resolve.nodes.filter(n => members.has(n.id)).flatMap(n => n.deps.map(d => d.pkg)));
          const crates = metadata.packages.filter(p => direct.has(p.id) && ['tauri', 'tauri-build'].includes(p.name));
          if (!crates.some(p => p.name === 'tauri')) throw new Error('No direct Tauri core dependency in the app workspace');
          for (const p of crates) {
            verify(p.name, p.version, targets.cargo[p.name]);
            if (p.name === 'tauri' && api && p.version.split('.')[1] !== api.version.split('.')[1]) {
              throw new Error('Tauri core and JS API must use the same minor');
            }
          }
          NODE
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  draft:                                 # ONE draft created up front: parallel tauri-action jobs would race to create duplicates
    needs: validate
    runs-on: ubuntu-latest
    permissions: { contents: write }
    outputs:
      id: ${{ steps.d.outputs.id }}
    env: { GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}' }
    steps:
      - id: d
        run: |
          set -euo pipefail
          matches=$(gh api --paginate --slurp "repos/$REPO/releases?per_page=100" |
            jq -c --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)]')
          if [[ "$matches" == '[]' ]]; then
            pre=(); [[ "$TAG" == *-* ]] && pre=(--prerelease)
            gh release create "$TAG" -R "$REPO" --draft --verify-tag "${pre[@]}" --title "$TAG" --notes "See CHANGELOG.md for details."
          else
            jq -e 'length == 1 and .[0].draft' <<< "$matches" >/dev/null || { echo "::error::$TAG already published or ambiguous"; exit 1; }
          fi
          draft=$(gh release view "$TAG" -R "$REPO" --json isDraft,databaseId)
          id=$(jq -er 'select(.isDraft) | .databaseId' <<< "$draft")
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: [validate, draft]
    permissions:
      contents: write                    # tauri-action creates/uploads to the draft
    strategy:
      fail-fast: false
      max-parallel: 1    # tauri-action updates one shared latest.json by reading and replacing it
      matrix:
        include:
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    args: '--target x86_64-pc-windows-msvc' }
          - { os: windows-latest,   target: aarch64-pc-windows-msvc,   args: '--target aarch64-pc-windows-msvc --bundles nsis' }  # cross-compiled ARM64; VERIFY on first run
          - { os: macos-latest,     target: aarch64-apple-darwin,      args: '--target aarch64-apple-darwin' }
          - { os: macos-latest,     target: x86_64-apple-darwin,       args: '--target x86_64-apple-darwin' }
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  args: '--bundles deb,appimage,rpm' }   # 22.04 = older glibc → wider AppImage/deb reach
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, args: '--bundles deb,appimage,rpm' }   # free for public repos; private repos: VERIFY runner availability
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ needs.validate.outputs.commit }}' }
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: './src-tauri -> target', key: '${{ matrix.target }}' }
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Developer ID + notarization (optional until you have an Apple account)
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          # Windows: Azure Artifact Signing via signCommand in tauri.conf (optional until public)
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}   # upload into the single draft (tag already asserted == app version)
          tagName: ${{ env.TAG }}          # version-specific feed URLs for this releaseId
          # Each build finishes its feed update before the next matrix leg starts.
          updaterJsonPreferNsis: true      # latest.json → NSIS (default would prefer MSI)
          # tauriScript unset: the action picks the runner from the lockfile (npm run/exec tauri, adds `--` itself)
          args: ${{ matrix.args }} -- --locked

  publish:
    needs: [validate, draft, build]
    concurrency:
      group: desktop-release-promotion
      queue: max
    outputs:
      latest: ${{ steps.promote.outputs.latest }}
    runs-on: ubuntu-latest
    environment: release                 # protect with required reviewers = human approval gate
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      VERSION: ${{ needs.validate.outputs.version }}
      COMMIT: ${{ needs.validate.outputs.commit }}
      DRAFT_ID: ${{ needs.draft.outputs.id }}
    steps:
      - name: Exactly one draft for this tag
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$REPO/releases?per_page=100" |
            jq -e --arg tag "$TAG" --arg id "$DRAFT_ID" '[.[][] | select(.tag_name == $tag)] | length == 1 and .[0].draft and (.[0].id | tostring) == $id'
      - name: Download draft assets   # gh resolves drafts by tag for authenticated callers
        run: gh release download "$TAG" -R "$REPO" -D dist
      - name: Verify updater feed and per-platform installers
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          jq -e --arg v "$VERSION" '.version == $v' latest.json
          keys=(windows-x86_64 windows-aarch64 darwin-aarch64 darwin-x86_64 linux-x86_64 linux-aarch64)
          # Newer clients prefer the bundle-specific key when present.
          mapfile -t overrides < <(jq -r '.platforms | keys[] | select(test("^(windows|darwin|linux)-(aarch64|x86_64)-(nsis|msi|app|appimage|deb|rpm)$"))' latest.json)
          for p in "${keys[@]}" "${overrides[@]}"; do
            url=$(jq -r --arg p "$p" '.platforms[$p].url // empty' latest.json)
            sig=$(jq -r --arg p "$p" '.platforms[$p].signature // empty' latest.json)
            [ -n "$url" ] && [ -n "$sig" ] || { echo "::error::latest.json missing $p"; exit 1; }
            # tauri-action v1 has emitted API asset URLs (/releases/assets/<id>) in
            # latest.json, not only browser download URLs. Resolve both shapes to
            # the asset name before checking the downloaded files.
            if [[ "$url" == "https://api.github.com/repos/$REPO/releases/assets/"* ]]; then
              asset_id="${url%%\?*}"; asset_id="${asset_id##*/}"
              [[ "$asset_id" =~ ^[0-9]+$ ]]
              if [[ ! -f "$RUNNER_TEMP/draft-assets.json" ]]; then
                gh api --paginate --slurp "repos/$REPO/releases/$DRAFT_ID/assets?per_page=100" > "$RUNNER_TEMP/draft-assets.json"
              fi
              name=$(jq -er --argjson id "$asset_id" '.[][] | select(.id == $id) | .name' "$RUNNER_TEMP/draft-assets.json")
            else
              [[ "$url" == "https://github.com/$REPO/releases/download/$TAG/"* ]] || { echo "::error::unexpected feed URL: $url"; exit 1; }
              name=$(basename "${url%%\?*}")
            fi
            [[ -f "$name" ]] || { echo "::error::$p references missing $name"; exit 1; }
            [[ -f "$name.sig" && "$(cat -- "$name.sig")" == "$sig" ]] || { echo "::error::$p signature differs from $name.sig"; exit 1; }
            IFS=- read -r os cpu bundle <<< "$p"
            case "$os/${bundle:-default}/$name" in
              windows/default/*-setup.exe|windows/default/*.nsis.zip|windows/nsis/*-setup.exe|windows/nsis/*.nsis.zip) ;;
              windows/msi/*.msi|windows/msi/*.msi.zip) ;;
              darwin/default/*.app.tar.gz|darwin/app/*.app.tar.gz) ;;
              linux/default/*.AppImage|linux/default/*.AppImage.tar.gz|linux/appimage/*.AppImage|linux/appimage/*.AppImage.tar.gz) ;;
              linux/deb/*.deb|linux/rpm/*.rpm) ;;
              *) echo "::error::$p references the wrong artifact: $name"; exit 1;;
            esac
            case "$cpu" in
              aarch64) arch='arm64|aarch64';;
              x86_64) arch='amd64|x64|x86_64';;
            esac
            [[ "$name" =~ (^|[-_.])($arch)([-_.]|$) ]] || { echo "::error::$p architecture mismatch: $name"; exit 1; }
          done
          # v1-compatible feeds may point to archives around the standalone NSIS/AppImage.
          for suffix in -setup.exe .AppImage .dmg .deb .rpm; do
            assets=( *"$suffix" )
            for arch in 'arm64|aarch64' 'amd64|x64|x86_64'; do
              printf '%s\n' "${assets[@]}" | grep -Ei "(^|[-_.])($arch)([-_.]|$)" >/dev/null || { echo "::error::missing $suffix ($arch)"; exit 1; }
            done
          done
      - name: SHA256SUMS (LF, generated on Linux)
        run: |
          cd dist && rm -f SHA256SUMS && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
          gh release upload "$TAG" -R "$REPO" SHA256SUMS --clobber
      - uses: actions/attest@v4
        with: { subject-checksums: dist/SHA256SUMS }
      - name: Publish and make latest
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          [[ "$current" == "$COMMIT" ]] || { echo "::error::Tag moved after validation"; exit 1; }
          latest=true; prerelease=false; case "$TAG" in *-*) latest=false; prerelease=true;; esac
          # A slower older tag may reach this job after a newer stable release.
          if [[ "$TAG" != *-* ]]; then
            published=$(gh api --paginate "repos/$REPO/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name | select(test("^v[0-9]+[.][0-9]+[.][0-9]+$"))')
            newest=$(printf '%s\n' "$TAG" "$published" | sort -V | tail -n 1)
            [[ "$newest" == "$TAG" ]] || latest=false
          fi
          gh api -X PATCH "repos/$REPO/releases/$DRAFT_ID" -F draft=false -F prerelease="$prerelease" -f make_latest="$latest" >/dev/null
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - name: Post-release verification (anonymous, like a real user)
        if: steps.promote.outputs.latest == 'true'
        run: |
          [ "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = "$TAG" ] || { echo "::error::releases/latest is not $TAG"; exit 1; }
          set -o pipefail
          # the API is the judge; the download redirect can lag a few minutes behind it
          for _ in $(seq 1 10); do
            curl -fsSL "https://github.com/$REPO/releases/latest/download/latest.json" -o "$RUNNER_TEMP/public-feed" && cmp -s dist/latest.json "$RUNNER_TEMP/public-feed" && exit 0
            sleep 60
          done
          echo "::error::public latest.json still not $VERSION after 10 min"; exit 1

  # --- winget -------------------------------------------------------------------------------
  # **清单不在这个仓里提交。** winget 的清单归 winget-manifests：那边的 apps.json 是唯一源，
  # 它自己巡检各发布仓的 release，发现新版本就重生成 manifest、往 winget-pkgs 开 PR。
  # 本仓只管把 release 发出去；把新应用加进 apps.json 即可。不要在这里再开第二条提交路径——
  # 两条路写同一个包，第二个 PR 会被当重复拒掉，看起来就像「winget 坏了」。
  # 不在那个流水线里的发布者，才用下面注释掉的 winget-releaser 写法。
  #   winget:                                # optional; delete if not on winget. First version must be submitted manually.
  #     needs: publish
  #     if: ${{ needs.publish.outputs.latest == 'true' && vars.WINGET_ID != '' }}
  #     runs-on: ubuntu-latest
  #     steps:
  #       - name: Token preflight
  #         env: { WINGET_TOKEN: '${{ secrets.WINGET_TOKEN }}' }
  #         run: '[ -n "$WINGET_TOKEN" ] || { echo "::error::WINGET_TOKEN (classic PAT: public_repo, workflow) missing"; exit 1; }'
  #       - uses: vedantmgoyal9/winget-releaser@v2
  #         with:
  #           identifier: ${{ vars.WINGET_ID }}
  #           release-tag: ${{ env.TAG }}
  #           installers-regex: '-setup\.exe$'
  #           max-versions-to-keep: 5
  #           token: ${{ secrets.WINGET_TOKEN }}
