<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  html, body { background: transparent; }

  * { margin: 0; box-sizing: border-box; }
  body {
    width: 100vmin; height: 100vmin;
    font-family: system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei",
                 "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .icon {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3.125vmin;
    border-radius: 22.5vmin;
    background: linear-gradient(140deg, #2f6df6 0%, #1b3fd8 60%, #5b2fe0 100%);
    color: #fff;
  }
  .glyph { font-size: 41.25vmin; font-weight: 800; line-height: 1; letter-spacing: -0.04em; }
  .word { font-size: 8.125vmin; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.86; }
</style>
</head>
<body>
  <div class="icon">
    <div class="glyph">书</div>
    <div class="word">Icon</div>
  </div>
</body>
</html>
