<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MD Web</title>
    <meta name="description" content="share and display markdown files online" />
    <!--
      Two directives carry the weight here:
        script-src 'self'  — no 'unsafe-inline', so HTML embedded in a rendered
                             document cannot run a script, an onerror= handler or a
                             javascript: URL. It is why the docsify config lives in
                             assets/config.js rather than in an inline <script>.
        connect-src 'self' — the viewer only ever fetches Markdown from the bucket
                             serving it, so a document route that somehow slipped
                             through the guard in config.js still cannot be fetched
                             from another origin.
      Images, fonts and frames stay open to https: because documents routinely embed
      remote images and videos, and a cross-origin frame cannot reach this origin
      anyway. Inline styles are allowed because docsify writes element.style.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; font-src 'self' data: https:; frame-src https:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="stylesheet" href="assets/vue.css" />
    <link rel="stylesheet" href="assets/toc.css" />
    <style>
      .anchor {
        font-weight: bold;
        text-shadow:
          0 1px 3px rgba(0, 0, 0, 0.4),
          0 0 30px rgba(0, 0, 0, 0.075);
      }

      .app-name {
        width: 150px;
      }

      section.cover h1 {
        margin: 1.5rem 0 1.5rem;
      }

      section.cover p {
        text-shadow:
          0 1px 3px rgba(0, 0, 0, 0.4),
          0 0 30px rgba(0, 0, 0, 0.075);
      }

      .app-sub-sidebar li:before {
        content: "○";
      }

      .page_toc {
        top: 12rem;
      }

      .github-corner {
        transform: scale(0.7);
        transform-origin: top right;
        opacity: 0.35;
        transition: opacity 0.3s;
      }

      .github-corner:hover {
        opacity: 1;
      }

      @media screen and (max-width: 1300px) {
        .nav {
          display: none;
        }
      }
    </style>
  </head>

  <body class="body--ready">
    <div id="app">Loading...</div>

    <!-- config.js first: it normalizes the document route before docsify reads it. -->
    <script src="assets/config.js"></script>
    <script src="assets/docsify.min.js"></script>
    <script src="assets/search.min.js"></script>
    <script src="assets/zoom-image.min.js"></script>
    <script src="assets/toc.js"></script>
    <script src="assets/countable.min.js"></script>
  </body>
</html>
