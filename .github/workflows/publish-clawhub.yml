name: Publish to ClawHub

on:
  workflow_dispatch:
    inputs:
      skill:
        description: "Skill dir under skills/ to publish (blank = all skills)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "skills/**"

# Serialize runs: two overlapping pushes must not publish the same skill from two
# different SHAs, where the older run can land last and move the registry backwards.
concurrency:
  group: publish-clawhub
  cancel-in-progress: false

jobs:
  # Decide which skills to publish: on push, only the ones whose files changed;
  # on manual dispatch, the chosen skill (or all). Avoids re-publishing an
  # unchanged skill at the same version (ClawHub rejects duplicate versions).
  detect:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.list.outputs.skills }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Determine which skills to publish
        id: list
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SKILL: ${{ github.event.inputs.skill }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          all_skills() {
            find skills -mindepth 1 -maxdepth 1 -type d \
              -exec test -f '{}/SKILL.md' ';' -print | sed 's#^skills/##'
          }
          base=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_SKILL" ]; then
              # One skill directory name and nothing else: this value reaches the
              # publish job, and the publish job holds the registry token.
              if ! printf '%s' "$INPUT_SKILL" | grep -qE '^[A-Za-z0-9._-]+$'; then
                echo "::error::skill must be a single directory name (letters, digits, dot, dash, underscore)"; exit 1
              fi
              if [ "$INPUT_SKILL" = "." ] || [ "$INPUT_SKILL" = ".." ] || [ ! -f "skills/$INPUT_SKILL/SKILL.md" ]; then
                echo "::error::skill must name an existing skill directory under skills/"; exit 1
              fi
              dirs="$INPUT_SKILL"
            else
              dirs="$(all_skills)"
            fi
          else
            base="$BEFORE"
            if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
            if [ -z "$base" ]; then
              dirs="$(all_skills)"
            else
              changed="$(git diff --name-only "$base" "$SHA" -- 'skills/' 2>/dev/null || true)"
              dirs="$(printf '%s\n' "$changed" | grep '^skills/' | cut -d/ -f2 | sort -u || true)"
              # keep only dirs that still have a SKILL.md (ignore deletes)
              dirs="$(for d in $dirs; do [ -f "skills/$d/SKILL.md" ] && echo "$d"; done)"
            fi
          fi
          json="$(printf '%s\n' "$dirs" | sed '/^$/d' | jq -R . | jq -cs .)"
          echo "skills=$json" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Will publish: $json"

      # Gate the whole workflow: publish only runs if this passes. It catches the failures
      # that are invisible until after upload — frontmatter that is not valid YAML (OpenClaw
      # then drops the metadata.openclaw block silently), a version that is not semver, a
      # files: entry that no longer exists, an os value that can never match, and content
      # changed without a version bump, which ClawHub refuses.
      - name: Validate skills
        env:
          BASE: ${{ steps.list.outputs.base }}
        run: |
          npm install --no-save --no-audit --no-fund js-yaml@4
          if [ -n "$BASE" ]; then
            node scripts/validate-skills.mjs --changed-since "$BASE"
          else
            node scripts/validate-skills.mjs
          fi

      # The md-web viewer fetches the Markdown it renders from a route in the URL
      # fragment, and its lifecycle writes replace the bucket's whole configuration
      # (S3 has no per-rule API). A regression in either is invisible in review and
      # destructive in production, and nothing else in this workflow would notice.
      - name: Test md-web
        run: |
          node scripts/test-md-web-viewer.mjs
          node scripts/test-md-web-lifecycle.mjs
          node scripts/test-md-web-publish.mjs

      # html-shot ships a browser-driven suite: unit tests for the shared helpers and
      # local-only end-to-end tests (HTTP, transparency, containers, failure paths,
      # icons). They run against a real Chromium, so this step is what stops a
      # regression from reaching ClawHub. The runner already has Chrome — use it
      # instead of downloading Playwright's browser on every push.
      - name: Test html-shot
        run: |
          cd skills/html-shot
          npm ci
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            echo "using system browser: $CHROME"
            export HTML_SHOT_EXECUTABLE="$CHROME"
          else
            node node_modules/playwright/cli.js install chromium
          fi
          npm run test:all

      # desktop-app-standard ships its own dependency-free Node test suite over its
      # scripts (version comparison, lockfile parsing, template self-checks, a mocked
      # online run, .NET TFM/SDK fixtures). They need no dependencies and no network,
      # so they are the cheapest guard in this workflow — and without this step
      # nothing would run them.
      - name: Test desktop-app-standard
        run: node --test skills/desktop-app-standard/tests/*.test.mjs

  publish:
    needs: detect
    if: needs.detect.outputs.skills != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.detect.outputs.skills) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install ClawHub CLI
        run: npm install -g clawhub

      - name: Authenticate
        run: |
          mkdir -p /tmp/clawhub
          printf '{"registry":"https://clawhub.ai","token":"%s"}' "$CLAWHUB_TOKEN" > /tmp/clawhub/config.json
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      - name: Extract version from SKILL.md
        id: version
        env:
          # Through the environment, never interpolated into the script: an
          # expression is substituted before the shell parses it, and the publish
          # job holds the registry token on disk.
          SKILL: ${{ matrix.skill }}
        run: |
          VERSION=$(grep '^version:' "skills/$SKILL/SKILL.md" | head -1 | sed 's/version:[[:space:]]*//')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish skill
        env:
          SKILL: ${{ matrix.skill }}
          VERSION: ${{ steps.version.outputs.value }}
          CLAWHUB_CONFIG_PATH: /tmp/clawhub/config.json
        run: clawhub publish "skills/$SKILL" --version "$VERSION"
