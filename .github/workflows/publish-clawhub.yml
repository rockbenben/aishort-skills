name: Publish to ClawHub

on:
  workflow_dispatch:
    inputs:
      skill:
        description: "Skill dir under skills/ to publish (blank = all skills)"
        required: false
        default: ""
  pull_request:
    paths: ["skills/**", "scripts/**", ".github/workflows/**", "package.json", "package-lock.json"]
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

# Serialize runs: two overlapping pushes must not publish the same skill from two
# different SHAs, where the older run can land last and move the registry backwards.
concurrency:
  group: publish-clawhub
  cancel-in-progress: false
  queue: max

jobs:
  # Decide which skills to publish: on push, only the ones whose files changed;
  # on manual dispatch, the chosen skill (or all). Avoids re-publishing an
  # unchanged skill at the same version (ClawHub rejects duplicate versions).
  detect:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.list.outputs.skills }}
      test-skills: ${{ steps.list.outputs.test-skills }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install repository tools
        run: npm ci

      - name: Determine skills to test and publish
        id: list
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SKILL: ${{ github.event.inputs.skill }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const git = (...args) => execFileSync('git', args, {encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe']}).trim();
          const all = fs.readdirSync('skills', {withFileTypes: true})
            .filter(d => d.isDirectory() && fs.existsSync(`skills/${d.name}/SKILL.md`))
            .map(d => d.name).sort();
          const { EVENT, INPUT_SKILL = '', BEFORE, SHA, PR_BASE } = process.env;
          let base = '', publish, tests;
          if (EVENT === 'workflow_dispatch') {
            if (INPUT_SKILL && !all.includes(INPUT_SKILL)) throw new Error('skill must name an existing skill directory under skills/');
            publish = INPUT_SKILL ? [INPUT_SKILL] : all;
            tests = publish;
          } else {
            if (EVENT === 'pull_request') {
              base = PR_BASE;
              if (!base) throw new Error('Missing pull request base');
            } else {
              base = BEFORE;
              try { git('cat-file', '-e', `${base}^{commit}`); }
              catch { try { base = git('rev-parse', 'HEAD^'); } catch { base = ''; } }
            }
            const changed = base ? git('diff', '--name-only', base, SHA).split('\n') : [];
            const skills = base ? all.filter(skill => changed.some(file => file.startsWith(`skills/${skill}/`))) : all;
            const shared = changed.some(file => /^(scripts\/|\.github\/workflows\/|package(?:-lock)?\.json$)/.test(file));
            publish = EVENT === 'pull_request' ? [] : skills;
            tests = shared ? all : skills;
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `skills=${JSON.stringify(publish)}\ntest-skills=${JSON.stringify(tests)}\nbase=${base}\n`);
          console.log('Test:', tests, 'Publish:', publish);
          NODE

      # Gate the whole workflow: publish only runs if this passes. It catches the failures
      # that are invisible until after upload — frontmatter that is not valid YAML (OpenClaw
      # then drops the metadata.openclaw block silently), a version that is not semver, a
      # files: entry that no longer exists, an os value that can never match, and content
      # changed without a version bump, which ClawHub refuses.
      - name: Validate skills
        env:
          BASE: ${{ steps.list.outputs.base }}
        run: |
          if [ -n "$BASE" ]; then
            node scripts/validate-skills.mjs --changed-since "$BASE"
          else
            node scripts/validate-skills.mjs
          fi

      - name: Use the runner's browser for html-shot
        if: contains(fromJson(steps.list.outputs.test-skills), 'html-shot')
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            echo "HTML_SHOT_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
          fi

      # Root regressions are lightweight. Installation tests select only affected
      # Skills and run html-shot's browser suite from its single isolated install.
      - name: Test repository and selected Skill installations
        env:
          TEST_SKILLS: ${{ steps.list.outputs.test-skills }}
        run: npm test

      - name: Test md-web
        if: contains(fromJson(steps.list.outputs.test-skills), 'md-web')
        run: |
          node scripts/test-md-web-viewer.mjs
          node scripts/test-md-web-lifecycle.mjs
          node scripts/test-md-web-publish.mjs

  wpf-packaging:
    needs: detect
    if: contains(fromJson(needs.detect.outputs.test-skills), 'wpf-desktop')
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: npm ci
      - run: node --test scripts/desktop-release-regressions.test.mjs

  publish:
    needs: [detect, wpf-packaging]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' &&
          needs.detect.result == 'success' && needs.detect.outputs.skills != '[]' &&
          (needs.wpf-packaging.result == 'success' || needs.wpf-packaging.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.detect.outputs.skills) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install repository tools
        run: npm ci

      - name: Authenticate
        run: |
          mkdir -p /tmp/clawhub
          printf '{"registry":"https://clawhub.ai","token":"%s"}' "$CLAWHUB_TOKEN" > /tmp/clawhub/config.json
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      - name: Read the validated skill version
        id: version
        env:
          SKILL: ${{ matrix.skill }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parseSkillMetadata, getSkillVersion } from './scripts/skill-metadata.mjs';
          const metadata = parseSkillMetadata(fs.readFileSync(`skills/${process.env.SKILL}/SKILL.md`, 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `value=${getSkillVersion(metadata)}\n`);
          NODE

      - name: Publish skill
        env:
          SKILL: ${{ matrix.skill }}
          VERSION: ${{ steps.version.outputs.value }}
          CLAWHUB_CONFIG_PATH: /tmp/clawhub/config.json
        run: npm run publish:skill -- "skills/$SKILL" --version "$VERSION"
