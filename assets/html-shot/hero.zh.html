<!doctype html>
<!--
  README hero card for the html-shot skill (Chinese). Source of truth — regenerate with:

    node skills/html-shot/render.mjs assets/html-shot/hero.zh.html assets/html-shot/hero.zh.png

  (run from the repo root). System fonts only, so it renders with no /fonts directory.

  Keep in sync with hero.html: the card text, and the og sample it shows, have to match the
  language of the README it sits under. hero.html's header lists the commands that rebuild
  the samples.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    position: relative;
    width: 1280px; height: 600px; overflow: hidden;
    display: flex; align-items: center; gap: 52px;
    padding: 0 68px;
    background: #f5f3ee; color: #14161a;
    font-family: system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei",
                 "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .text { flex: 1 1 auto; min-width: 0; }
  .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: 0.16em; color: #6b7280; }
  h1 { font-size: 62px; line-height: 1.06; font-weight: 800; letter-spacing: -0.02em; margin-top: 16px; }
  h1 .hl { color: #ff5a3c; }
  .sub { font-size: 23px; line-height: 1.6; color: #55595f; margin-top: 20px; }
  .showcase { flex: 0 0 448px; display: flex; flex-direction: column; gap: 24px; }
  .card {
    width: 448px; height: 236px; overflow: hidden; border-radius: 10px;
    box-shadow: 0 18px 40px rgba(20, 22, 26, 0.22), 0 2px 6px rgba(20, 22, 26, 0.16);
  }
  .card img { width: 100%; height: 100%; display: block; }
  .sizes { display: flex; align-items: flex-end; gap: 28px; padding-left: 4px; }
  .sizes img { display: block; }
  .foot { position: absolute; left: 68px; bottom: 30px; font-size: 20px; color: #8b9098; }
</style>
</head>
<body>
  <div class="text">
    <div class="eyebrow">AGENT SKILL</div>
    <h1>任何 HTML。<br />产出<span class="hl">可交付</span>的图片。</h1>
    <div class="sub">og:images · 截图 · favicon · 应用图标集<br />无头 Chromium 渲染，系统字体，无需打包。</div>
  </div>
  <div class="showcase">
    <div class="card"><img src="samples/og.zh.png" alt="html-shot 渲染出的 og:image 卡片" /></div>
    <div class="sizes">
      <img src="samples/icons/favicon-32.png" width="32" height="32" alt="32px favicon" />
      <img src="samples/icons/icon-192.png" width="68" height="68" alt="icon-192.png" />
      <img src="samples/icons/icon-512.png" width="124" height="124" alt="icon-512.png" />
    </div>
  </div>
  <div class="foot">github.com/rockbenben/aishort-skills · skills/html-shot</div>
</body>
</html>
