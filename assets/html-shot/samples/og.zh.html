<!doctype html>
<!--
  Sample og:image used inside assets/html-shot/hero.zh.html (Chinese card).
  Source of truth — regenerate with:

    node skills/html-shot/render.mjs assets/html-shot/samples/og.zh.html assets/html-shot/samples/og.zh.png

  (run from the repo root). It is a real render, not a mock-up: the hero shows the
  skill's own output. System fonts only, so it renders with no /fonts directory.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    position: relative;
    width: 1200px; height: 630px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 88px; gap: 24px;
    background: #0f1115; color: #f4f4f2;
    font-family: system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei",
                 "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .eyebrow { font-size: 22px; font-weight: 600; letter-spacing: 0.14em; color: #8b93a1; }
  h1 { font-size: 82px; line-height: 1.06; font-weight: 800; letter-spacing: -0.02em; max-width: 980px; }
  h1 .hl { color: #ff5a3c; }
  .sub { font-size: 28px; color: #aab2c0; max-width: 940px; line-height: 1.5; }
  .foot { position: absolute; left: 88px; bottom: 52px; font-size: 24px; color: #6b7280; }
</style>
</head>
<body>
  <div class="eyebrow">OG image · 1200×630</div>
  <h1>你的标题，<br />用<span class="hl">浏览器</span>渲染。</h1>
  <div class="sub">真实 CSS，系统字体，无需打包。</div>
  <div class="foot">yoursite.com</div>
</body>
</html>
